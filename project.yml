name: GitMenu
options:
  bundleIdPrefix: com.kelvinamoaba
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "GitMenu Dev"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  GitMenu:
    type: application
    platform: macOS
    sources:
      - path: GitMenu
    info:
      path: GitMenu/Resources/Info.plist
      properties:
        CFBundleName: GitMenu
        CFBundleDisplayName: GitMenu
        CFBundleShortVersionString: "0.2.3"
        CFBundleVersion: "5"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.kelvinamoaba.GitMenu
            CFBundleURLSchemes: [gitmenu]
    entitlements:
      path: GitMenu/Resources/GitMenu.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kelvinamoaba.GitMenu
        GENERATE_INFOPLIST_FILE: NO
